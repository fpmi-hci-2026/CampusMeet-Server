<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusMeet — Афиша университетских мероприятий (ЛР7)</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo-area">
        <div class="logo-badge">CM</div>
        <div>
          <div class="logo-title">CampusMeet</div>
          <div class="logo-subtitle">ПЧМИ ФПМИ БГУ • Лабораторная работа №7</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="role-selector">
          <span>Роль:</span>
          <select id="userSelector">
            <option value="artem">Артём Ковалёв (Слушатель)</option>
            <option value="maxim">Максим Романов (Организатор)</option>
            <option value="daria">Дарья Мельникова (Волонтер)</option>
            <option value="kirill">Кирилл Савицкий (Team Lead)</option>
          </select>
        </div>
        <a href="/mobile/" class="btn-secondary" target="_blank">📱 Мобильный билет</a>
        <a href="/docs" class="btn-secondary" target="_blank">📖 Swagger API</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-section">
      <div>
        <h1 class="hero-title">Афиша университетских событий</h1>
        <p class="hero-subtitle">
          Серверное приложение и первая страница веб-клиента. Управление квотами, живое бронирование и автоматический лист ожидания.
        </p>
      </div>
      <div class="live-indicator">
        <span class="pulse-dot"></span>
        <span>REST API: ONLINE (FastAPI)</span>
      </div>
    </section>

    <div class="controls-bar">
      <div class="filter-tabs">
        <button class="tab-btn active" data-type="">Все типы</button>
        <button class="tab-btn" data-type="meetup">Митапы</button>
        <button class="tab-btn" data-type="hackathon">Хакатоны</button>
        <button class="tab-btn" data-type="workshop">Воркшопы</button>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск мероприятий...">
      </div>
    </div>

    <div id="eventsContainer" class="events-grid">
      <!-- Event cards will be dynamically loaded here -->
    </div>
  </main>

  <!-- Registration Modal -->
  <div id="regModal" class="modal-overlay">
    <div class="modal-box">
      <button id="closeModal" class="modal-close">&times;</button>
      <h3 id="modalEventTitle" style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Регистрация на событие</h3>
      <p id="modalEventDetails" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;"></p>
      
      <div id="modalForm">
        <div style="margin-bottom: 14px;">
          <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">Участник:</label>
          <input type="text" id="modalUserName" readonly style="width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 14px;">
        </div>
        <div style="margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="modalWaitlist" checked style="accent-color: var(--accent-indigo); cursor: pointer;">
          <label for="modalWaitlist" style="font-size: 13px; color: var(--text-secondary); cursor: pointer;">
            Встать в лист ожидания (Waitlist), если закончатся свободные места
          </label>
        </div>
        <button id="submitRegBtn" class="btn-primary" style="width: 100%; justify-content: center; padding: 10px;">
          Подтвердить бронирование
        </button>
      </div>

      <div id="modalResult" style="display: none;">
        <!-- Success Ticket View -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
