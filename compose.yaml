name: campusmeet-lab4
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mock-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ../CampusMeet-Web
    environment:
      API_URL: http://api:8000/api/v1
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    profiles: ["database"]
    environment:
      POSTGRES_DB: campusmeet
      POSTGRES_USER: campusmeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.postgresql.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusmeet -d campusmeet"]
      interval: 5s
      timeout: 3s
      retries: 10
  sonarqube:
    image: sonarqube:community
    profiles: ["quality"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
volumes:
  mock-data:
  postgres-data:
  sonar-data:
  sonar-extensions:
