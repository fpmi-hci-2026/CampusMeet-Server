name: Optional cloud quality and reviewed deployment
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy an already reviewed revision after checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check campusmeet scripts tests && python -m unittest discover -s tests -v
      - name: Require configured SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: test -n "$SONAR_TOKEN" && test -n "$SONAR_ORGANIZATION"
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
      - run: docker build -t campusmeet-api:reviewed .
  deploy:
    if: inputs.deploy
    needs: quality
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Invoke configured Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK" > /dev/null
